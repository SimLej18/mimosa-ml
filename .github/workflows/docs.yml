name: Build Sphinx docs

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --locked fails the build on a stale uv.lock rather than silently re-resolving, so the docs
      # are built against the pinned dependency set. --no-default-groups keeps the dev group
      # (pytest, pre-commit) out.
      - name: Install package and docs dependencies
        run: uv sync --locked --python 3.12 --no-default-groups --group docs

      - name: Build docs
        run: uv run sphinx-build -b html docs docs/_build/html

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
