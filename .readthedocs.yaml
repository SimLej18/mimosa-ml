version: 2

# The docs dependencies live in a PEP 735 dependency-group, which pip cannot install, so the
# environment is built with uv against uv.lock instead of Read the Docs' default pip install.
# `build.jobs.build.html` overrides the `sphinx:` key, so the config path is passed here.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install uv
      - uv sync --locked --no-default-groups --group docs
    build:
      html:
        - uv run sphinx-build -b html docs $READTHEDOCS_OUTPUT/html
